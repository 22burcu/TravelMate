<!DOCTYPE html> <!--das ist eine html5 datei (5 version)-->
<html lang="de">    <!--sprache-->

<body>
    <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#"> <!-- platzhalter für link für #-->
                <i class="bi bi-airplane"></i> TravelMate
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="#">Trips finden</a> <!-- TRIPS LINK - link zur trip-suche PLATZHALTER-->
<!-- Quellen https://getbootstrap.com/docs/4.0/components/navbar/

-->
    {% if current_user.is_authenticated %}
                    <!--eingeloggt -->
                    <a class="nav-link" href="#">Dashboard</a>

                {% else %}

                {% endif %}
