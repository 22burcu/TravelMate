{% extends "base.html" %}

{% block fullwidth %}


<!-- Hintergrundbild -->
<div style="
    background-image: url('https://images.unsplash.com/photo-1506869640319-fe1a24fd76dc?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
    background-size: cover;
    background-position: center;
    min-height: calc(110vh);
    display: grid;
    place-items: center;
">
<!--quellen
bilder https://unsplash.com/de/fotos/silhouettenfoto-von-sechs-personen-auf-dem-gipfel-des-berges-Sj0iMtq_Z4w

-->


<div class="text-center py-5">

    <h1 class="display-4 mb-3" text-dark>
        Willkommen bei TravelMate
        <i class="bi bi-globe-americas"></i>
    </h1>

    <p class="lead text-dark mb-5">
        Finde Mitreisende oder schließe dich einer bestehenden Reise an.
    </p>



    <div class="row justify-content-center mb-5">       <!-- suchleiste -->
        <div class="col-md-10">
            <form action="{{ url_for('trips.trips_list') }}" method="GET">
                <div class="input-group input-group-lg">
                    <input type="text" name="destination" class="form-control" 
                           placeholder="Wohin möchtest du reisen? z.B. Tokyo">
                    <button class="btn btn-dark" type="submit">
                        <i class="bi bi-search"></i> Suchen
                    </button>
                </div>
            </form>
        </div>
    </div>

</div>
</div>

{% endblock %}
